<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Muntaka & Rounaikka ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<div id="loader">

<div class="heart-loader"></div>

<p>Loading Love...</p>

</div>

<div id="hearts"></div>

<div class="animated-bg"></div>

<section id="password-screen">

<div class="glass card">

<h1>❤️</h1>

<h2>Welcome Muntaka</h2>

<p>Enter our secret code baby</p>

<input
type="password"
id="passwordInput"
placeholder="Password">

<button id="unlockBtn">

Unlock

</button>

<p id="passwordMessage"></p>

</div>

</section>

<div id="website" class="hidden">

<header class="hero">

<div class="glass hero-card">

<h1 id="heroTitle"></h1>

<p id="heroSubtitle"></p>

<a href="#letter">

Lovlu letter for you ❤️

</a>

</div>

</header>

<section id="letter">

<div class="glass section-card">

<h2>Lovlu Letter</h2>

<p id="loveLetter"></p>

</div>

</section>

<section id="gallery">

<h2>Memory box</h2>

<div class="gallery-grid" id="galleryGrid">

</div>

</section>

<section id="timer">

<div class="glass timer-card">

<h2>I have loved you for</h2>

<div id="countdown"></div>

</div>

</section>

<section id="surprise">

<button id="surpriseBtn">

Click For Surprise ❤️

</button>

</section>

<footer>

Made For U ❤️ S

</footer>

</div>

<audio id="bgMusic" loop></audio>

<script src="config/data.js"></script>

<script src="js/password.js"></script>

<script src="js/main.js"></script>

<script src="js/gallery.js"></script>

<script src="js/timer.js"></script>

<script src="js/music.js"></script>

<script src="js/confetti.js"></script>

</body>

</html>
